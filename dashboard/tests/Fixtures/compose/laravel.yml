services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PHP_VERSION: "8.4"
    ports:
      - "${APP_PORT:-80}:8080"
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-laravel}
      DB_USERNAME: ${DB_USERNAME:-sail}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      REDIS_HOST: redis
      MAIL_MAILER: log
    depends_on:
      - mysql
      - redis

  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: php artisan queue:work --tries=3
    environment:
      DB_HOST: mysql
      DB_PASSWORD: ${DB_PASSWORD:-password}
    depends_on: [mysql]

  mysql:
    image: mysql/mysql-server:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-sail}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - sail-mysql:/var/lib/mysql

  redis:
    image: redis:alpine
    volumes:
      - sail-redis:/data

volumes:
  sail-mysql:
  sail-redis:
