schema: launchroom.template/v1
id: uptime-kuma
name: Uptime Kuma
tagline: Watch your sites and APIs and get told when they go down.
description: >-
    HTTP, TCP, DNS and keyword checks with status pages and notifications to
    the channels you already use. You create the admin account on first visit.
category: monitoring
logo: uptimekuma
website: https://uptime.kuma.pet
license: MIT
inputs:
    - id: domain
      label: Domain
      type: domain
      optional: true
      description: Leave empty to use the generated address; you can add one later.
services:
    uptime-kuma:
        image: docker.io/louislam/uptime-kuma:2.5.6-rootless@sha256:de832f85c00823594b2e056da1db4cd7d2d99ce2e0a997c870cc7c1749e3c731
        ports: ['3001']
        volumes:
            - data:/app/data
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:3001/']
            start_period: 60s
        x-launchroom:
            name: Uptime Kuma
            logo: uptimekuma
            domain: ${input.domain}
