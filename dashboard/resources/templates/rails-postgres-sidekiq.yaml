schema: launchroom.template/v1
id: rails-postgres-sidekiq
name: Rails + Postgres + Sidekiq
tagline: Rails with Sidekiq, a managed Postgres and Redis.
description: >-
    Builds your repository once for Puma and Sidekiq. DATABASE_URL and
    REDIS_URL are connected for you and SECRET_KEY_BASE is generated.
category: stacks
logo: rails
inputs:
    - id: repository
      label: Repository
      type: repository
services:
    web:
        environment:
            RAILS_ENV: production
            RAILS_LOG_TO_STDOUT: '1'
            RAILS_SERVE_STATIC_FILES: '1'
            DATABASE_URL: ${service.db.url}
            REDIS_URL: ${service.redis.url}
            SECRET_KEY_BASE: ${generate:hex:64}
        depends_on: [db, redis]
        x-launchroom:
            name: web
            logo: rails
            source: repository
            public: true
    sidekiq:
        command: ['bundle', 'exec', 'sidekiq']
        environment:
            RAILS_ENV: production
            RAILS_LOG_TO_STDOUT: '1'
            DATABASE_URL: ${service.db.url}
            REDIS_URL: ${service.redis.url}
            SECRET_KEY_BASE: ${service.web.env.SECRET_KEY_BASE}
        depends_on: [db, redis]
        x-launchroom:
            name: sidekiq
            logo: sidekiq
            parent: web
    db:
        x-launchroom:
            name: Postgres
            database: { engine: postgres, version: '18' }
    redis:
        x-launchroom:
            name: Redis
            database: { engine: redis, version: '7' }
