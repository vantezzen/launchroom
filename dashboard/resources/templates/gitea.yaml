schema: launchroom.template/v1
id: gitea
name: Gitea
tagline: Git hosting with pull requests, issues and packages.
description: >-
    A lightweight forge for your repositories, code review and CI runners. The
    first account you register becomes the administrator. Git over HTTPS works
    right away, while SSH stays on the private network.
category: developer
logo: gitea
website: https://about.gitea.com
license: MIT
repositories:
    - https://github.com/go-gitea/gitea
    - https://gitea.com/gitea/gitea
inputs:
    - id: domain
      label: Domain
      type: domain
      optional: true
      description: Clone URLs use this address. Leave empty to use the generated one.
services:
    gitea:
        image: docker.io/gitea/gitea:28.2.0-rootless@sha256:94807314454f6525994a3b76286ba12bc7e7f8cd14f61d9e67431767f8103306
        ports: ['3000']
        environment:
            GITEA__server__ROOT_URL: ${self.public_url}/
            GITEA__server__DISABLE_SSH: 'true'
            GITEA__database__DB_TYPE: postgres
            GITEA__database__HOST: ${service.db.host}:${service.db.port}
            GITEA__database__NAME: ${service.db.database}
            GITEA__database__USER: ${service.db.user}
            GITEA__database__PASSWD: ${service.db.password}
            GITEA__security__SECRET_KEY: ${generate:password:64}
            GITEA__security__INSTALL_LOCK: 'true'
            GITEA__service__DISABLE_REGISTRATION: 'false'
        volumes:
            - data:/var/lib/gitea
            - config:/etc/gitea
        depends_on: [db]
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/healthz']
            start_period: 60s
        x-launchroom:
            name: Gitea
            logo: gitea
            domain: ${input.domain}
    db:
        x-launchroom:
            name: Postgres
            database: { engine: postgres, version: '17' }
