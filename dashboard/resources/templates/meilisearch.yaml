schema: launchroom.template/v1
id: meilisearch
name: Meilisearch
tagline: Fast, typo-tolerant search for your apps.
description: >-
    A search engine with instant results, filters and facets behind a simple
    API. The master key is generated; use it to create search keys for your
    apps.
category: search
logo: meilisearch
website: https://www.meilisearch.com
license: MIT
inputs:
    - id: domain
      label: Domain
      type: domain
      optional: true
      description: Leave empty to use the generated address.
services:
    meilisearch:
        image: docker.io/getmeili/meilisearch:v1.55.0@sha256:ff546679970126f8822e15d1b6a06bfbff1f2ce2e43f810cfb5258012f92de5c
        ports: ['7700']
        environment:
            MEILI_ENV: production
            MEILI_NO_ANALYTICS: 'true'
            MEILI_MASTER_KEY: ${generate:password:32}
        volumes:
            - data:/meili_data
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:7700/health']
        x-launchroom:
            name: Meilisearch
            logo: meilisearch
            domain: ${input.domain}
