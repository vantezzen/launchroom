# launchroom control plane (docs/11 §2, docs/02 §4.1).
#
# MANAGED FILE: the installer replaces it on every upgrade. Do not edit; put
# local changes (resource limits, extra env) in compose.override.yml next to it,
# which `docker compose` picks up automatically.
#
# Everything lives in this folder: settings and secrets in .env (generated by
# install.sh), state in ./data/* bind mounts. Every container and network
# carries launchroom.managed=true + launchroom.role=control-plane, which is
# what `./launchroom uninstall` selects by.
#
# Ingress: nothing here publishes 80/443. The local launchroomd runs Caddy as a
# system container (host network) and routes the dashboard host (APP_URL) to
# the dashboard on 127.0.0.1:${LR_DASHBOARD_PORT} (a "system route" in the
# control-plane server's NodeState, docs/05 §4). Reverb's WebSocket path
# (/app/*) is proxied by the dashboard's own FrankenPHP to the reverb service.

name: launchroom

x-labels: &labels
  launchroom.managed: "true"
  launchroom.role: control-plane

# Docker's json-file driver with rotation, without touching daemon.json.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-dashboard-env: &dashboard-env
  APP_NAME: launchroom
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?run install.sh to generate .env}
  APP_PREVIOUS_KEYS: ${APP_PREVIOUS_KEYS:-}
  APP_URL: ${APP_URL:?}
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: launchroom
  DB_USERNAME: launchroom
  DB_PASSWORD: ${DB_PASSWORD:?}
  REDIS_CLIENT: phpredis
  REDIS_HOST: valkey
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${VALKEY_PASSWORD:?}
  SESSION_DRIVER: redis
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
  # Session payloads (flashed input, password-confirmation state) are encrypted at rest in Valkey.
  SESSION_ENCRYPT: "true"
  QUEUE_CONNECTION: redis
  CACHE_STORE: redis
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: ${REVERB_APP_ID:?}
  REVERB_APP_KEY: ${REVERB_APP_KEY:?}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:?}
  # How PHP reaches Reverb (inside the compose network).
  REVERB_HOST: reverb
  REVERB_PORT: "6001"
  REVERB_SCHEME: http
  REVERB_SERVER_HOST: 0.0.0.0
  REVERB_SERVER_PORT: "6001"
  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_SCHEME: ${MAIL_SCHEME:-}
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_PORT: ${MAIL_PORT:-}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-launchroom@localhost}
  # Key files (docs/09 R13, R22, R24), created by `launchroom:keys:generate`.
  LAUNCHROOM_KEK_PATH: /data/keys/kek
  LAUNCHROOM_SIGNING_KEY_PATH: /data/keys/signing.ed25519
  LAUNCHROOM_REGISTRY_TOKEN_KEY_PATH: /data/keys/registry-token.es256.pem
  LAUNCHROOM_REGISTRY_TOKEN_PUBLIC_KEY_PATH: /data/keys/registry-public/registry-token.pub.pem
  # System route for the dashboard on the control-plane server (docs/05 §4).
  LAUNCHROOM_DASHBOARD_UPSTREAM: 127.0.0.1:${LR_DASHBOARD_PORT:-8000}
  # Mesh (docs/05 §2): the dashboard drives Headscale's API on lr-system;
  # servers log in through APP_URL (this container forwards the paths).
  LAUNCHROOM_HEADSCALE_URL: http://headscale:8080
  LAUNCHROOM_HEADSCALE_BOOTSTRAP_KEY_PATH: /data/keys/headscale-api-key
  # Headscale's state (read-only) joins the control-plane key bundle (docs/14 §9.6).
  LAUNCHROOM_HEADSCALE_STATE_PATH: /data/headscale
  # Image templated into /install/server.sh for servers that join later.
  LAUNCHROOM_DAEMON_IMAGE: ${LR_DAEMON_IMAGE:?}
  # Edge Caddy of this release (launchroom-caddy, pinned in launchroomd;
  # docs/05 §4). Its name turns on shared storage and DNS-01
  # (launchroom.ingress.caddy_modules; every DNS provider of the image).
  LAUNCHROOM_CADDY_IMAGE: ${LR_CADDY_IMAGE:?}
  # Settings → Dashboard domain (docs/05 §4.1): the HTTPS test request may
  # also reach launchroomd's Caddy through the host (NAT without hairpinning).
  LAUNCHROOM_DASHBOARD_PROBE_ADDRESS: host.docker.internal
  # Chunks of data imports and downloads, encrypted at rest (docs/14 §12.1).
  LAUNCHROOM_TRANSFERS_PATH: /data/transfers

x-dashboard: &dashboard
  image: ${LR_DASHBOARD_IMAGE:?}
  labels: *labels
  logging: *logging
  restart: unless-stopped
  environment: *dashboard-env
  # The host, for the dashboard domain's HTTPS test (Caddy listens there).
  extra_hosts:
    - host.docker.internal:host-gateway
  volumes:
    - ./data/keys:/data/keys:ro
    - ./data/headscale/lib:/data/headscale:ro
    # Data import and export chunks (docs/14 §12.1): the web container
    # receives them, the scheduler sweeps them.
    - ./data/transfers:/data/transfers
  depends_on:
    postgres:
      condition: service_healthy
    valkey:
      condition: service_healthy

services:
  # Web: FrankenPHP on :8000 (image CMD). Runs migrations on start
  # (entrypoint, `migrate --force --isolated`). Loopback only: launchroomd's
  # Caddy is the public entry point.
  dashboard:
    <<: *dashboard
    environment:
      <<: *dashboard-env
      # Browser WebSockets (/app/*) reach Reverb through this container, and
      # servers' mesh clients reach Headscale's control protocol (an HTTP
      # upgrade on /ts2021), its key and its DERP relay (an upgrade on /derp)
      # through it (docs/05 §2). Headscale's REST API is not forwarded.
      CADDY_SERVER_EXTRA_DIRECTIVES: |
        reverse_proxy /app/* reverb:6001
        @headscale path /ts2021 /key /machine/* /derp /derp/* /bootstrap-dns
        reverse_proxy @headscale headscale:8080
      # Zot's config, rendered by `launchroom:registry:config --write` from the
      # registry settings (local disk or S3, docs/14 §9.11); `./launchroom
      # registry apply` writes it and restarts zot.
      LAUNCHROOM_ZOT_CONFIG_PATH: /data/zot/config.json
    volumes:
      # Writable: `launchroom:keys:generate` and `launchroom:restore` run here.
      - ./data/keys:/data/keys
      - ./data/backups:/data/backups
      - ./data/transfers:/data/transfers
      - ./data/zot/config.json:/data/zot/config.json
      - ./data/headscale/lib:/data/headscale:ro
    ports:
      - 127.0.0.1:${LR_DASHBOARD_PORT:-8000}:8000
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8000/up"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 6

  horizon:
    <<: *dashboard
    command: ["php", "artisan", "horizon"]
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  reverb:
    <<: *dashboard
    command: ["php", "artisan", "reverb:start"]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 6001) ? 0 : 1);"]
      interval: 15s
      timeout: 3s
      start_period: 60s
      retries: 3

  scheduler:
    <<: *dashboard
    command: ["php", "artisan", "schedule:work"]
    # No probe: schedule:work is a foreground loop; a crash restarts the container.
    healthcheck:
      disable: true

  postgres:
    image: ${LR_POSTGRES_IMAGE:?}
    labels: *labels
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: launchroom
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_DB: launchroom
    volumes:
      # Postgres 18 images keep data in a versioned subdirectory; mount the parent.
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "launchroom", "-d", "launchroom"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: ${LR_VALKEY_IMAGE:?}
    labels: *labels
    logging: *logging
    restart: unless-stopped
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?}
      REDISCLI_AUTH: ${VALKEY_PASSWORD:?}
    # The password goes into a config file inside the container (printf is a
    # shell builtin), so it never appears in the host's process list.
    command:
      - sh
      - -c
      - printf 'requirepass "%s"\n' "$$VALKEY_PASSWORD" > /tmp/valkey.conf && exec valkey-server /tmp/valkey.conf --appendonly yes --dir /data
    volumes:
      - ./data/valkey:/data
    # Loopback only, for launchroomd on this host: with two or more edges it
    # serves <mesh IP>:6379 → here for the edges' shared certificate storage
    # (system.certStorage, docs/05 §5). Edges log in as the ACL user
    # lr-caddy, restricted to the lr-caddy key prefix; the dashboard creates
    # it (ACL SETUSER, re-applied every minute so a Valkey restart heals).
    ports:
      - 127.0.0.1:${LR_VALKEY_PORT:-6380}:6379
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Registry (docs/05 §6): bearer auth with dashboard-issued tokens. Loopback
  # only (Docker pulls from 127.0.0.1:5000 without insecure-registry config).
  # Other servers reach it over the mesh: with the mesh on, launchroomd serves
  # <mesh IP>:5000 and forwards to this port (system.registry.serveOnMesh).
  zot:
    image: ${LR_ZOT_IMAGE:?}
    labels: *labels
    logging: *logging
    restart: unless-stopped
    ports:
      - 127.0.0.1:5000:5000
    volumes:
      # Rendered by the dashboard (local disk or S3 storage, docs/14 §9.11).
      - ./data/zot/config.json:/etc/zot/config.json:ro
      # Images on local storage; with S3 only Zot's local metadata.
      - ./data/zot/storage:/var/lib/registry
      # Only the public half of the registry token key.
      - ./data/keys/registry-public:/etc/zot/keys:ro
    # No healthcheck: the image is distroless (no shell, no curl).

  # Mesh coordination (docs/05 §2): Headscale with its embedded DERP relay.
  # It idles until a second server joins (the dashboard then turns the mesh
  # on: ACL policy, per-server keys). State in ./data/headscale/lib (in
  # control-plane backups); config written by install.sh. STUN on udp/3478
  # helps servers behind NAT connect directly; DERP over the dashboard's
  # HTTPS port always works.
  headscale:
    image: ${LR_HEADSCALE_IMAGE:?}
    labels: *labels
    logging: *logging
    restart: unless-stopped
    command: ["serve"]
    ports:
      - 3478:3478/udp
    volumes:
      - ./data/headscale/config.yaml:/etc/headscale/config.yaml:ro
      - ./data/headscale/lib:/var/lib/headscale
    healthcheck:
      test: ["CMD", "headscale", "health"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  # The control-plane host's own launchroomd (docs/03 §2), enrolled by install.sh.
  # dockerd-guard owns the Docker socket; launchroomd reaches Docker only
  # through its allow-listed API (docs/09 §6, D49).
  dockerd-guard:
    image: ${LR_DAEMON_IMAGE:?}
    entrypoint: ["/usr/local/bin/dockerd-guard"]
    labels: *labels
    logging: *logging
    restart: always
    network_mode: none
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    environment:
      LR_LOG_LEVEL: ${LR_LOG_LEVEL:-info}
      LR_INTERACTIVE_SESSIONS: ${LR_INTERACTIVE_SESSIONS:-on}
      LR_SYSTEM_IMAGE_DIGESTS: ${LR_SYSTEM_IMAGE_DIGESTS:-}
      LR_GUARD_ALLOWED_REGISTRIES: ${LR_GUARD_ALLOWED_REGISTRIES:-}
    volumes:
      - ${LR_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - guard-socket:/run/launchroom
    healthcheck:
      test: ["CMD", "/usr/local/bin/dockerd-guard", "healthcheck"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12

  launchroomd:
    image: ${LR_DAEMON_IMAGE:?}
    labels: *labels
    logging: *logging
    restart: always
    depends_on:
      dockerd-guard:
        condition: service_healthy
    # Running tasks get 20 s to finish on SIGTERM, then are handed back (docs/03 §7).
    stop_grace_period: 30s
    network_mode: host
    pid: host
    cap_add: [NET_ADMIN]
    environment:
      # Host network: the dashboard's loopback port. Every payload is signed.
      # While `install.sh --move` brings launchroom here, launchroomd first
      # joins the old dashboard (LR_CONTROL_PLANE_URL in .env, docs/14 §13.4).
      LR_CONTROL_PLANE_URL: ${LR_CONTROL_PLANE_URL:-http://127.0.0.1:${LR_DASHBOARD_PORT:-8000}}
      LR_CP_KEY_FILE: /data/cp-key
      # Set by install.sh only until launchroomd has enrolled.
      LR_JOIN_TOKEN_FILE: ${LR_JOIN_TOKEN_FILE:-}
      LR_LOG_LEVEL: ${LR_LOG_LEVEL:-info}
      # Host time zone, recorded by the installer (suggests the server location).
      LR_HOST_TIMEZONE: ${LR_HOST_TIMEZONE:-}
      # Local policy (docs/03 §8): the only route address upstream allowed
      # outside the mesh range is the dashboard's loopback port (its system
      # route). Anything else the control plane sends is refused.
      LR_ALLOWED_LOCAL_UPSTREAMS: 127.0.0.1:${LR_DASHBOARD_PORT:-8000}
      # Local policy (docs/03 §11.3): Console/Data sessions into this server's
      # containers: on | console | data | off.
      LR_INTERACTIVE_SESSIONS: ${LR_INTERACTIVE_SESSIONS:-on}
      # Local policy (docs/14 §12.2): data imports and exports on this
      # server: on | off.
      LR_DATA_TRANSFERS: ${LR_DATA_TRANSFERS:-on}
      # Docker through dockerd-guard (D49).
      DOCKER_HOST: unix:///run/launchroom/docker.sock
    volumes:
      - guard-socket:/run/launchroom
      - ./data/daemon:/data
    # No healthcheck: distroless image; `./launchroom status` shows enrollment.

networks:
  default:
    name: lr-system
    labels: *labels

volumes:
  # dockerd-guard's socket for launchroomd.
  guard-socket:
    labels: *labels
