# launchroom local development stack (docs/11-installation-and-dev.md §6).
#
# Use the root Makefile (`make up`, `make help`) rather than calling compose
# directly; it passes the right env file and build args.
#
# Containment rules (keep the developer's own Docker clean):
#   - Project name `launchroom-dev`: every container, network and volume is
#     prefixed `launchroom-dev`; built images are `launchroom-dev-*:dev`.
#   - Everything carries the label `launchroom.dev=true`; `make nuke` selects
#     by that label / the compose project, never a global prune.
#   - Host ports bind to 127.0.0.1 ONLY (never 0.0.0.0), and are configurable
#     in dev/.env (see .env.example).
#   - Only the dind "fake servers" are privileged. Deployed test apps, their
#     images and volumes live in the fake servers' nested Docker, whose state
#     is kept in named volumes.
#
# All credentials below are DEV-ONLY defaults for a stack that is reachable
# from 127.0.0.1 only. Never reuse them anywhere else.

name: launchroom-dev

x-labels: &labels
  launchroom.dev: "true"

# Dev image of the dashboard (deploy/images/dashboard/Dockerfile, target dev).
# Every service using it repeats the build section so any of them can build it;
# BuildKit's cache makes the repeats free.
x-dashboard-build: &dashboard-build
  context: ..
  dockerfile: deploy/images/dashboard/Dockerfile
  target: dev
  args:
    UID: ${LR_DEV_UID:-1000}
    GID: ${LR_DEV_GID:-1000}
  labels: *labels

# Laravel config for the dev stack. Real environment variables win over
# dashboard/.env, so these point the app at the compose services no matter
# what the developer's dashboard/.env says (APP_KEY still comes from there).
x-dashboard-env: &dashboard-env
  APP_ENV: local
  # Same version as the dev daemons (root VERSION + "-dev", exported by the
  # Makefile), so dev doesn't compare 0.0.0-dev against 0.1.0-dev.
  LAUNCHROOM_VERSION: ${LR_VERSION:-0.0.0}-dev
  APP_URL: http://localhost:${LR_DEV_DASHBOARD_PORT:-8000}
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: launchroom
  DB_USERNAME: launchroom
  DB_PASSWORD: launchroom # dev-only
  REDIS_CLIENT: phpredis
  REDIS_HOST: valkey
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "null"
  QUEUE_CONNECTION: redis
  CACHE_STORE: redis
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: launchroom-dev
  REVERB_APP_KEY: launchroom-dev-key # dev-only
  REVERB_APP_SECRET: launchroom-dev-secret # dev-only
  REVERB_HOST: reverb # how PHP reaches Reverb (inside the network)
  REVERB_PORT: "6001"
  REVERB_SCHEME: http
  REVERB_SERVER_HOST: 0.0.0.0
  REVERB_SERVER_PORT: "6001"
  # Realtime daemon nudges (docs/03 §4): the fake servers' daemons reach Reverb
  # directly on the compose network (the dev FrankenPHP does not proxy /app/*).
  LAUNCHROOM_DAEMON_NUDGE_URL: ws://reverb:6001
  # Preview protection (docs/06 §5): the fake servers' Caddy asks the
  # dashboard on the compose network (the daemons' control-plane URL origin,
  # which their local policy allows for forward auth).
  LAUNCHROOM_PREVIEW_AUTH_URL: http://dashboard:8000/auth/preview
  # The dev Forgejo (profile "forgejo") delivers webhooks to the compose name (docs/19 §8).
  LAUNCHROOM_GIT_WEBHOOK_URL: http://dashboard:8000
  # Apps are served on the host-mapped HTTPS port (LR_INGRESS_HTTPS_PORT).
  LAUNCHROOM_PREVIEW_HTTPS_PORT: "${LR_DEV_HTTPS_PORT:-8443}"
  # Generate a Dockerfile (docs/20 §8): no real API key in dev, a stub model
  # answers from a fixture. Set LR_DOCKERFILE_MODEL=anthropic in dev/.env and
  # add a key in Settings → Dockerfile generation to try the real one.
  LAUNCHROOM_DOCKERFILE_MODEL: ${LR_DOCKERFILE_MODEL:-stub}
  LAUNCHROOM_DOCKERFILE_STUB_RESPONSE: /var/www/html/tests/Fixtures/Dockerfiles/unplannable-site.json
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: "1025"
  MAIL_SCHEME: "null"
  # Key-encryption key for envelope encryption (docs/09). Lives in a named
  # volume, not in the bind-mounted source tree.
  LAUNCHROOM_KEK_PATH: /data/keys/kek
  # Control-plane Ed25519 signing key (docs/03 §4.1), same volume.
  LAUNCHROOM_SIGNING_KEY_PATH: /data/keys/signing.ed25519
  # Registry token signing key (ES256, docs/05 §6). The public half lives in
  # its own subdirectory, the only part of the keys volume Zot mounts.
  LAUNCHROOM_REGISTRY_TOKEN_KEY_PATH: /data/keys/registry-token.es256.pem
  LAUNCHROOM_REGISTRY_TOKEN_PUBLIC_KEY_PATH: /data/keys/registry-public/registry-token.pub.pem
  # Mesh (docs/05 §2): the dev Headscale of `make up-multi` (dev/compose.multi.yml),
  # plain http on the compose network. Without it the mesh simply can't be enabled.
  LAUNCHROOM_HEADSCALE_URL: http://headscale
  LAUNCHROOM_MESH_LOGIN_SERVER: http://headscale
  LAUNCHROOM_HEADSCALE_BOOTSTRAP_KEY_PATH: /data/keys/headscale-api-key

x-dashboard: &dashboard
  image: launchroom-dev-dashboard:dev
  # Locally built images: never try a registry pull, build when missing.
  pull_policy: never
  build: *dashboard-build
  labels: *labels
  restart: unless-stopped
  environment: *dashboard-env
  volumes:
    - ../dashboard:/var/www/html
    - ./dashboard:/opt/launchroom-dev:ro
    - keys:/data/keys
    # Protocol schemas + fixtures for contract tests (read-only).
    - ../protocol:/var/www/protocol:ro
    # Daemon installer served at /install/server.sh (same paths as the production image).
    - ../deploy/install/server.sh:/var/www/install/server.sh:ro
    - ../deploy/daemon/compose.yml:/var/www/install/daemon-compose.yml:ro
  depends_on:
    postgres:
      condition: service_healthy
    valkey:
      condition: service_healthy

services:
  postgres:
    image: postgres:18-alpine
    labels: *labels
    restart: unless-stopped
    environment:
      POSTGRES_USER: launchroom
      POSTGRES_PASSWORD: launchroom # dev-only
      POSTGRES_DB: launchroom
    volumes:
      # Postgres 18 images keep data in a versioned subdirectory; mount the parent.
      - postgres:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # For a local DB GUI. 127.0.0.1 only.
      - 127.0.0.1:${LR_DEV_POSTGRES_PORT:-54320}:5432
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "launchroom", "-d", "launchroom"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    labels: *labels
    restart: unless-stopped
    volumes:
      - valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  dashboard:
    <<: *dashboard
    # FrankenPHP classic mode serving public/ on :8000 (image CMD).
    ports:
      - 127.0.0.1:${LR_DEV_DASHBOARD_PORT:-8000}:8000
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8000/up"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6

  vite:
    <<: *dashboard
    # Same image as the dashboard: the wayfinder Vite plugin shells out to
    # `php artisan wayfinder:generate`, so Vite needs PHP next to Node.
    command: ["/opt/launchroom-dev/with-node-modules.sh", "npm", "run", "dev"]
    # npm → vp → vite is a process tree. tini (init) forwards SIGTERM to the
    # whole process group so laravel-vite-plugin removes public/hot on stop
    # (a stale hot file would make the dashboard load assets from a dead server).
    init: true
    depends_on: {}
    environment:
      <<: *dashboard-env
      # LARAVEL_SAIL makes laravel-vite-plugin listen on 0.0.0.0:$VITE_PORT
      # (strictPort) and write http://localhost:$VITE_PORT into public/hot, which
      # is what the browser on the host needs for assets and the HMR socket.
      # Container and host port are kept identical for the same reason.
      LARAVEL_SAIL: "1"
      TINI_KILL_PROCESS_GROUP: "1"
      VITE_PORT: ${LR_DEV_VITE_PORT:-5173}
      # Browser-side Reverb settings (the browser connects via the host port).
      VITE_REVERB_APP_KEY: launchroom-dev-key
      VITE_REVERB_HOST: localhost
      VITE_REVERB_PORT: ${LR_DEV_REVERB_PORT:-6001}
      VITE_REVERB_SCHEME: http
    volumes:
      - ../dashboard:/var/www/html
      - ./dashboard:/opt/launchroom-dev:ro
      # Linux node_modules, shadowing the host's (which may be macOS-native).
      - node_modules:/var/www/html/node_modules
    ports:
      - 127.0.0.1:${LR_DEV_VITE_PORT:-5173}:${LR_DEV_VITE_PORT:-5173}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:$${VITE_PORT}/@vite/client"]
      interval: 10s
      timeout: 3s
      # The first start runs `npm ci` into the node_modules volume.
      start_period: 300s
      retries: 6

  # Workers. Code changes need a restart: `make restart-workers`.
  # horizon/reverb wait (instead of crash-looping) until their package is installed.
  horizon:
    <<: *dashboard
    command: ["/opt/launchroom-dev/artisan-when-available.sh", "horizon"]
    healthcheck:
      disable: true

  reverb:
    <<: *dashboard
    command: ["/opt/launchroom-dev/artisan-when-available.sh", "reverb:start", "--debug"]
    ports:
      # Not 8080: that's the fake server's HTTP ingress.
      - 127.0.0.1:${LR_DEV_REVERB_PORT:-6001}:6001
    healthcheck:
      disable: true

  scheduler:
    <<: *dashboard
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true

  zot:
    # v2.1.22, multi-arch index digest (linux/amd64, linux/arm64).
    image: ghcr.io/project-zot/zot@sha256:96cda11459ce6f8c60da3b03f03e9f67fd11b3ae2d82c4c04c92b3c608996080
    labels: *labels
    restart: unless-stopped
    # Internal only: reachable as http://zot:5000 inside the network (server-1's
    # daemon forwards its 127.0.0.1:5000 here, LR_REGISTRY_UPSTREAM). Bearer auth
    # with dashboard-issued ES256 tokens, on-demand mirror of docker.io and
    # ghcr.io under mirror/, retention for apps/** (docs/05 §6, dev/zot/config.json).
    # The token public key comes from the keys volume (`make up` creates it).
    # No healthcheck: the image is distroless (no shell/curl).
    volumes:
      - ./zot/config.json:/etc/zot/config.json:ro
      - zot:/var/lib/registry
      - type: volume
        source: keys
        target: /etc/zot/keys
        read_only: true
        volume:
          subpath: registry-public

  # Dev-only git server: serves dev/fixtures/* as repositories over smart HTTP
  # (http://git-fixtures:8080/<name>.git; GET / lists names and commit SHAs) so
  # builds can clone fixtures without GitHub. Read-only, internal only.
  git-fixtures:
    image: launchroom-dev-git-fixtures:dev
    pull_policy: never
    build:
      context: ..
      dockerfile: dev/git-fixtures/Dockerfile
      args:
        GO_IMAGE: ${LR_GO_IMAGE:-golang:1.27}
      labels: *labels
    labels: *labels
    restart: unless-stopped
    volumes:
      - ./fixtures:/fixtures:ro
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 6

  # Dev-only Forgejo (profile "forgejo", `make up-forgejo`, docs/19 §8): a real
  # Gitea-API server for the git providers end-to-end test (connect with a
  # token, import, push → deploy, pull request → preview). Rootless image,
  # SQLite, built-in SSH on 2222; http://forgejo:3000 on the compose network,
  # http://127.0.0.1:3300 for the browser. Dev-only credentials (make dev-forgejo).
  forgejo:
    image: codeberg.org/forgejo/forgejo:11-rootless@sha256:f7c2234b9ef3115c00f0b6dc6d2d0923171ab7785995f83ca70fb132b81b79e0
    labels: *labels
    profiles: [forgejo]
    restart: unless-stopped
    environment:
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__server__ROOT_URL: http://forgejo:3000/
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__DOMAIN: forgejo
      FORGEJO__server__SSH_DOMAIN: forgejo
      FORGEJO__server__START_SSH_SERVER: "true"
      FORGEJO__server__SSH_PORT: "2222"
      FORGEJO__server__SSH_LISTEN_PORT: "2222"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      # Webhooks go to the dashboard on the compose network.
      FORGEJO__webhook__ALLOWED_HOST_LIST: private
      FORGEJO__webhook__SKIP_TLS_VERIFY: "false"
      FORGEJO__log__LEVEL: Warn
    volumes:
      - forgejo-data:/var/lib/gitea
      - forgejo-config:/etc/gitea
    ports:
      - 127.0.0.1:${LR_DEV_FORGEJO_PORT:-3300}:3000
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/api/v1/version"]
      interval: 10s
      timeout: 3s
      retries: 12

  # Dev-only S3 target for backups (profile "backups", `make up-backups`):
  # versitygw v1.9.0 with its posix backend (MinIO no longer publishes
  # images). Plain http on the compose network only, no host ports. Use it as
  # a destination with endpoint http://versitygw:7070 and "allow a private
  # network" (dev credentials below; never reuse them).
  versitygw:
    image: docker.io/versity/versitygw@sha256:eb7f786fcd91e72194e48fcf1ac16302d686bf8e3a71434bdbc067a6efd3fdc7
    labels: *labels
    profiles: [backups]
    restart: unless-stopped
    environment:
      ROOT_ACCESS_KEY: launchroom-dev # dev-only
      ROOT_SECRET_KEY: launchroom-dev-secret # dev-only
    command: ["posix", "/data"]
    volumes:
      - backups-s3:/data

  mailpit:
    image: axllent/mailpit:v1.31.6
    labels: *labels
    restart: unless-stopped
    ports:
      - 127.0.0.1:${LR_DEV_MAILPIT_PORT:-8025}:8025
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 6

  # "Fake server": its own Docker daemon (dind) + launchroomd.
  # Roles edge+runtime+build are assigned by the dashboard at enrollment.
  server-1:
    image: launchroom-dev-dind:dev
    pull_policy: never
    build:
      context: ./dind
      args:
        UID: ${LR_DEV_UID:-1000}
        GID: ${LR_DEV_GID:-1000}
      labels: *labels
    labels: *labels
    hostname: server-1
    # The ONLY privileged containers in the stack are the dind fake servers.
    privileged: true
    restart: unless-stopped
    environment:
      LR_DEV_SERVER_NAME: server-1
      # Pretend host time zone (suggests a location for the server map).
      LR_HOST_TIMEZONE: Europe/Berlin
      # Dev never asks IP echo services (fake servers have no public address).
      LR_PUBLIC_IP_DETECT: "off"
      LR_CONTROL_PLANE_URL: http://dashboard:8000
      LR_CP_KEY: ${LR_DEV_CP_KEY:-}
      LR_JOIN_TOKEN_FILE: /data/join-token
      # Alternative to LR_CP_KEY (a file in the data volume); if both are set they must match.
      LR_CP_KEY_FILE: /data/cp-key
      # Redirects point at the host-mapped HTTPS port (apps on https://<name>.localhost:8443).
      LR_INGRESS_HTTPS_PORT: "${LR_DEV_HTTPS_PORT:-8443}"
      LR_DOCKERD_ARGS: ${LR_DEV_DOCKERD_ARGS:-}
      # Registry forwarder target (docs/05 §6): launchroomd serves 127.0.0.1:5000
      # and forwards to the dev Zot on the compose network.
      LR_REGISTRY_UPSTREAM: zot:5000
      # Fixture repositories are cloned over plain http from the dev git server
      # and the dev Forgejo (profile "forgejo", docs/19 §8).
      LR_BUILD_INSECURE_GIT_HOSTS: git-fixtures,forgejo
      # The dev S3 target (profile "backups") speaks plain http (docs/14 §3).
      LR_BACKUP_INSECURE_HOSTS: versitygw
      # Network isolation of apps and builds (nftables in the fake server's
      # kernel namespace, docs/05 §1). Dev apps that must reach a dev-stack
      # service (e.g. mailpit) need its CIDR in LR_DEV_FIREWALL_ALLOW_PRIVATE.
      LR_FIREWALL: ${LR_DEV_FIREWALL:-enforce}
      LR_FIREWALL_ALLOW_PRIVATE: ${LR_DEV_FIREWALL_ALLOW_PRIVATE:-}
      # The dev Headscale (make up-multi) speaks plain http (docs/05 §2).
      LR_MESH_INSECURE_LOGIN_HOSTS: headscale
      # Certificate storage on the mesh (system.certStorage, docs/05 §5):
      # launchroomd serves <mesh IP>:6379 → the dev Valkey.
      LR_CERT_STORAGE_UPSTREAM: valkey:6379
    volumes:
      - server-1-docker:/var/lib/docker # nested Docker state (images, app containers, volumes)
      - server-1-data:/data # daemon data dir (keys, state.json, caddy cache)
      - daemon-bin:/opt/launchroom/bin:ro # built by `make dev-daemon`
    ports:
      # launchroomd's Caddy (inside the nested Docker) publishes 80/443 on the
      # fake server; apps are reachable at http(s)://<name>.localhost:8080/8443.
      - 127.0.0.1:${LR_DEV_HTTP_PORT:-8080}:80
      - 127.0.0.1:${LR_DEV_HTTPS_PORT:-8443}:443
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

  # --- Tools (profile "tools"): one-off containers used by the Makefile. -----

  # Dashboard test runner (`make test-dashboard`). Deliberately minimal env: only
  # the DB/Valkey hosts are pinned (to the separate launchroom_test database);
  # everything else comes from phpunit.xml's testing defaults.
  test:
    image: launchroom-dev-dashboard:dev
    # Tool containers share a CPU budget so parallel workstreams can't saturate the host.
    cpus: ${LR_TOOL_CPUS:-4}
    pull_policy: never
    build: *dashboard-build
    labels: *labels
    profiles: [tools]
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: launchroom_test
      DB_USERNAME: launchroom
      DB_PASSWORD: launchroom # dev-only
      REDIS_HOST: valkey
    volumes:
      - ../dashboard:/var/www/html
      - ./dashboard:/opt/launchroom-dev:ro
      - node_modules:/var/www/html/node_modules
      # Protocol schemas + fixtures for the contract tests (read-only).
      - ../protocol:/var/www/protocol:ro
      # The real daemon installer, for tests/Feature/Install (read-only).
      - ../deploy/install/server.sh:/var/www/install/server.sh:ro
      - ../deploy/daemon/compose.yml:/var/www/install/daemon-compose.yml:ro
      # The installer's Zot config template, to keep the dashboard's renderer in sync (docs/14 §9.11).
      - ../deploy/images/zot/config.json:/var/www/install/zot-config.json:ro
    entrypoint: ["/opt/launchroom-dev/with-node-modules.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # Go toolchain (`make test-daemon`, `gen-protocol`, `dev-daemon`).
  go:
    image: launchroom-dev-go:dev
    # Tool containers share a CPU budget so parallel workstreams can't saturate the host.
    cpus: ${LR_TOOL_CPUS:-4}
    pull_policy: never
    build:
      context: ./go
      args:
        GO_IMAGE: ${LR_GO_IMAGE:-golang:1.27}
        UID: ${LR_DEV_UID:-1000}
        GID: ${LR_DEV_GID:-1000}
      labels: *labels
    labels: *labels
    profiles: [tools]
    working_dir: /src/daemon
    volumes:
      - ../daemon:/src/daemon
      - ../cli:/src/cli # launchroom CLI module (make test-cli, docs/16)
      - ../protocol:/src/protocol
      - go-mod:/go/pkg/mod
      - go-build:/home/launchroom/.cache/go-build
      - daemon-bin:/out
      - itest-bin:/itest # daemon integration test binaries (make test-daemon-integration)
      - ./zot:/src/dev/zot:ro # registry config used by the build integration tests
      - ../deploy:/src/deploy:ro # install scripts used by the self-update integration test

  golangci-lint:
    image: ${LR_GOLANGCI_IMAGE:-golangci/golangci-lint:v2.15.0}
    # Tool containers share a CPU budget so parallel workstreams can't saturate the host.
    cpus: ${LR_TOOL_CPUS:-4}
    labels: *labels
    profiles: [tools]
    working_dir: /src/daemon
    environment:
      GOLANGCI_LINT_CACHE: /cache/golangci
      GOCACHE: /cache/go-build
    volumes:
      # Read-only: lint never writes to the source tree.
      - ../daemon:/src/daemon:ro
      - ../cli:/src/cli:ro
      - ../protocol:/src/protocol:ro
      - golangci-cache:/cache
      - golangci-mod:/go/pkg/mod

  # Ephemeral Docker daemon for launchroomd's integration tests
  # (`make test-daemon-integration`). Same dind image as the fake servers, but
  # without launchroomd supervisor: just the nested dockerd (unix socket only, no
  # TCP, no host ports). The test binary is built into the itest-bin volume and
  # executed INSIDE this container, so it shares the daemon's network and PID
  # namespaces exactly like launchroomd on a real server (container IPs and
  # /proc/<pid>/net are reachable). The container is removed after each run;
  # its image cache survives in the dind-test-docker volume.
  dind-test:
    image: launchroom-dev-dind:dev
    cpus: ${LR_TOOL_CPUS:-4}
    pull_policy: never
    build:
      context: ./dind
      args:
        UID: ${LR_DEV_UID:-1000}
        GID: ${LR_DEV_GID:-1000}
      labels: *labels
    labels: *labels
    profiles: [tools]
    hostname: dind-test
    privileged: true
    entrypoint: ["dockerd-entrypoint.sh", "dockerd", "--host=unix:///var/run/docker.sock"]
    volumes:
      - dind-test-docker:/var/lib/docker
      - itest-bin:/opt/launchroom/bin:ro
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 2s
      timeout: 5s
      start_period: 30s
      retries: 30

  # Rootless Docker "fake server" for `make test-daemon-integration-rootless`
  # (D49): docker:dind-rootless (Docker as the unprivileged user "rootless"
  # behind RootlessKit). The integration binary runs inside it as a
  # host-network container, i.e. in RootlessKit's network namespace like
  # launchroomd on a rootless server. Privileged only so the nested
  # RootlessKit can set up its user namespace (Docker's documented
  # requirement for dind-rootless). Ports below 1024 are unprivileged in it,
  # as server.sh --rootless requires on real hosts.
  dind-rootless-test:
    image: docker:29-dind-rootless@sha256:825e451c9bd898245ca8fb07bd9a48999ccf33c0192fd68594c73aed7b67d11f
    cpus: ${LR_TOOL_CPUS:-4}
    labels: *labels
    profiles: [tools]
    hostname: dind-rootless-test
    privileged: true
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    # Unix socket only (no TCP API inside the compose network).
    command: ["dockerd", "--host=unix:///run/user/1000/docker.sock"]
    volumes:
      - dind-rootless-test-docker:/home/rootless/.local/share/docker
      - itest-bin:/opt/launchroom/bin:ro
    healthcheck:
      test: ["CMD", "docker", "-H", "unix:///run/user/1000/docker.sock", "info"]
      interval: 2s
      timeout: 5s
      start_period: 60s
      retries: 60

networks:
  default:
    labels: *labels

volumes:
  postgres: { labels: *labels }
